<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>V1 Künye — arka</title>
<link rel="stylesheet" href="kart.css"><style>
@page{size:91mm 61mm;margin:0}
body{font-family:"Atkinson Next",sans-serif}
/* QR sembolü güvenli alan köşesine oturur; beyaz sessiz alan köşe payına taşar (mürekkepsiz). */
.qr{left:calc(var(--safe) - var(--qz));bottom:calc(var(--safe) - var(--qz))}
.alan{right:var(--safe);bottom:var(--safe);text-align:right}
.hizmet{font-size:6.5pt;line-height:1.3;color:var(--muted);letter-spacing:.01em}
.url{font:400 8pt/1.2 "Atkinson Mono",monospace;color:var(--navy);margin-top:1.2mm}
</style></head><body>
<img class="abs qr" src="../../../qr/beynelmilel-org.svg" alt="beynelmilel.org QR kodu">
<div class="abs alan"><p class="hizmet">Sistemler · Web siteleri · Reklam</p><p class="url">beynelmilel.org</p></div>
</body></html>
